[project]
name = "disa-dj-project"
version = "2.30.0"
description = "Django web application for Stolen Relations data entry and public interfaces."
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "asgiref==3.8.1",
    "certifi==2024.7.4",
    "charset-normalizer==2.0.12",
    "django==3.2.25",
    "idna==3.7",
    "pymysql==1.1.1",
    "python-dotenv==1.0.1",
    "pytz==2024.1",
    "requests==2.27.1",
    "sqlalchemy==1.3.12",
    "sqlparse==0.5.1",
    "typing-extensions==4.12.2",
    "urllib3==1.26.19",
]

[dependency-groups]
local = []
staging = []
prod = [
    "mysqlclient==2.1.1",
]
